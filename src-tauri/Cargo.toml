[package]
name = "waw-hud-editor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
